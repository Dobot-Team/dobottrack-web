      text-anchor="middle"
    >
      DobotTrack
    </text>
    <text x="908" y="246" font-size="13" fill="#acbfd5" text-anchor="middle">
      Shared VLA backbone
    </text>
    <path d="M824 269H992" stroke="#496078" />
    <text x="908" y="305" font-size="13" fill="#d9e3ee" text-anchor="middle">
      Chronological history
    </text>
    <text x="908" y="330" font-size="13" fill="#d9e3ee" text-anchor="middle">
      Target-grounded representations
    </text>
    <text x="908" y="381" font-size="12" fill="#a5baf2" text-anchor="middle">
      One forward pass
    </text>
    <rect
      x="1132"
      y="150"
      width="220"
      height="72"
      rx="7"
      fill="#eaf7ef"
      stroke="#c3e1ce"
    />
    <text x="1154" y="181" font-size="16" font-weight="bold">Target mask</text>
    <text x="1154" y="204" font-size="12" fill="#5b7e69">
      Foreground delineation
    </text>
    <rect
      x="1132"
      y="252"
      width="220"
      height="72"
      rx="7"
      fill="#eaf7ef"
      stroke="#c3e1ce"
    />
    <text x="1154" y="283" font-size="16" font-weight="bold">Target box</text>
    <text x="1154" y="306" font-size="12" fill="#5b7e69">
      Location, extent &amp; visibility
    </text>
    <rect
      x="1132"
      y="354"
      width="220"
      height="72"
      rx="7"
      fill="#eef3ff"
      stroke="#c3d2f4"
    />
    <text x="1154" y="385" font-size="16" font-weight="bold">
      Future waypoints
    </text>
    <text x="1154" y="408" font-size="12" fill="#627ca9">8 steps · 10 Hz</text>
    <g stroke="#8091a6" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
      <path d="M283 164H376" />
      <path d="M283 319H376" />
      <path d="M283 444H376" />
      <path d="M666 181H730V220H796" />
      <path d="M666 319H796" />
      <path d="M666 443H730V383H796" />
      <path d="M1020 220H1074V186H1132" />
      <path d="M1020 287H1132" />
      <path d="M1020 355H1074V390H1132" />
    </g>
    <path
      d="M1242 150V87H521V106"
      stroke="#194ed4"
      stroke-width="1.7"
      stroke-dasharray="5 5"
      fill="none"
      marker-end="url(#blue-arrow)"
    />
    <rect x="730" y="75" width="372" height="24" fill="white" />
    <text x="916" y="92" text-anchor="middle" font-size="12" fill="#194ed4">
      Cached target localization · subsequent decisions
    </text>
    <text x="48" y="523" font-size="11" fill="#8692a1">
      Conceptual overview · historical target regions guide compression;
      current-frame features remain dense.
    </text>
  </g>
</svg>
