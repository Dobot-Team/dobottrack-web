<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="540"
  viewBox="0 0 1400 540"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    DobotTrack: grounded perception, compact history, future waypoints
  </title>
  <desc id="desc">
    Seven historical visual feature sets are compressed by Q-identity. These
    tokens, current-frame features and the target instruction enter a shared
    VLA. It predicts a target mask, target box, and eight waypoints. Cached
    localization predictions guide region selection at subsequent decisions.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8091a6" />
    </marker>
    <marker
      id="blue-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#194ed4" />
    </marker>
  </defs>
  <rect width="1400" height="540" fill="white" />
  <g font-family="Arial, sans-serif" fill="#172331">
    <text x="48" y="57" font-size="12" fill="#778599" letter-spacing="2">
      OBSERVATIONS
    </text>
    <text x="376" y="57" font-size="12" fill="#194ed4" letter-spacing="2">
      VISUAL REPRESENTATION
    </text>
    <text x="796" y="57" font-size="12" fill="#778599" letter-spacing="2">
      SHARED POLICY
    </text>
    <text x="1132" y="57" font-size="12" fill="#778599" letter-spacing="2">
      PREDICTIONS
    </text>
    <rect
      x="48"
      y="106"
      width="235"
      height="116"
      rx="9"
      fill="#f3f6fa"
      stroke="#dde4ed"
    />
    <text x="70" y="137" font-size="17" font-weight="bold">
      Historical features
    </text>
    <text x="70" y="160" font-size="12" fill="#6b7889">
      7 frames · 256 tokens / frame
    </text>
    <g fill="#bbc9dc">
      <rect x="70" y="179" width="17" height="21" rx="2" />
      <rect x="93" y="179" width="17" height="21" rx="2" />
      <rect x="116" y="179" width="17" height="21" rx="2" />
      <rect x="139" y="179" width="17" height="21" rx="2" />
      <rect x="162" y="179" width="17" height="21" rx="2" />
      <rect x="185" y="179" width="17" height="21" rx="2" />
      <rect x="208" y="179" width="17" height="21" rx="2" />
    </g>
    <rect
      x="48"
      y="275"
      width="235"
      height="87"
      rx="9"
      fill="#f3f6fa"
      stroke="#dde4ed"
    />
    <text x="70" y="310" font-size="17" font-weight="bold">
      Current-frame features
    </text>
    <text x="70" y="336" font-size="12" fill="#6b7889">
      Dense visual representation
    </text>
    <rect
      x="48"
      y="400"
      width="235"
      height="87"
      rx="9"
      fill="#f3f6fa"
      stroke="#dde4ed"
    />
    <text x="70" y="434" font-size="17" font-weight="bold">
      Target description
    </text>
    <text x="70" y="460" font-size="12" fill="#6b7889">
      Appearance-based instruction
    </text>
    <rect
      x="376"
      y="106"
      width="290"
      height="153"
      rx="9"
      fill="#eef3ff"
      stroke="#c3d2f4"
    />
    <text x="398" y="140" font-size="22" font-weight="bold" fill="#194ed4">
      Q-identity
    </text>
    <text x="398" y="168" font-size="13">Target-region features + queries</text>
    <text x="398" y="192" font-size="13">Full-image context aggregation</text>
    <rect x="398" y="214" width="241" height="27" rx="4" fill="#194ed4" />
    <text x="518" y="233" font-size="12" fill="white" text-anchor="middle">
      16 tokens / historical frame
    </text>
    <rect
      x="376"
      y="289"
      width="290"
      height="60"
      rx="7"
      fill="#f3f6fa"
      stroke="#dde4ed"
    />
    <text x="521" y="325" font-size="14" text-anchor="middle">
      256 current-frame visual tokens
    </text>
    <rect
      x="376"
      y="413"
      width="290"
      height="60"
      rx="7"
      fill="#f3f6fa"
      stroke="#dde4ed"
